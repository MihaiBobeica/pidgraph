[project]
name = "pidgraph"
version = "0.1.0"
description = "P&ID drawings to a standards-conformant plant graph, cross-referenced against an SOP"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "pillow>=10.0",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Container and CI use opencv-python-headless deliberately: it drops the libGL runtime
# dependency that opencv-python pulls in. See docs/assumptions.md PLAT-10.
raster = ["opencv-python-headless>=4.8"]
db = ["psycopg2-binary>=2.9"]
stats = ["statsmodels>=0.14"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
pidgraph = "pidgraph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pidgraph*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
markers = ["corpus: assertions about the supplied sample drawings, not the general contract"]

[tool.mypy]
packages = ["pidgraph"]
ignore_missing_imports = true
